[project]
name = "archie-agent"
version = "0.1.0"
description = "Archie agent server"
requires-python = ">=3.13,<3.14"
dependencies = [
    "click>=8,<9",
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[project.scripts]
archie-agent = "archie_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/archie_agent"]

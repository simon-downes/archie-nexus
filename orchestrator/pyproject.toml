[project]
name = "archie-orchestrator"
version = "0.1.0"
description = "Archie orchestrator — host-side control plane"
requires-python = ">=3.13,<3.14"
dependencies = [
    "archie-shared",
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/archie_orchestrator"]

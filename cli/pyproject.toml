[project]
name = "archie-cli"
version = "0.1.0"
description = "Archie CLI client"
requires-python = ">=3.13,<3.14"
dependencies = [
    "archie-orchestrator",
    "archie-shared",
    "boto3>=1.35",
    "click>=8,<9",
    "httpx>=0.27",
    "python-ulid>=3.1.0",
    "textual>=1.0",
    "typing-extensions>=4.0",
    "websockets>=13",
]

[project.scripts]
archie = "archie_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/archie_cli"]

[project]
name = "archie-shared"
version = "0.1.0"
description = "Shared types, events, and config for archie-nexus"
requires-python = ">=3.13,<3.14"
dependencies = [
    "msgspec>=0.19",
    "pyyaml>=6,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/archie_shared"]

name: aws
# Generic AWS credentials (for non-Bedrock AWS services); `archie auth login aws`
# reads them from the standard AWS credential chain. They are not projected into the
# container: bin/credential-process reads them from the store on every AWS call.
credential:
  kind: static
  fields: [access_key_id, secret_access_key, session_token]
  env:
    access_key_id: AWS_ACCESS_KEY_ID
    secret_access_key: AWS_SECRET_ACCESS_KEY
    session_token: AWS_SESSION_TOKEN
  set_env: false
  login: aws_chain
settings:
  region: {type: str, default: eu-west-1}
  profiles: {type: "dict[str,str]"}
# Writes container-local ~/.aws/config profiles from `settings.profiles` (no tools).
hooks: {startup: "archie_plugins.aws.profiles:write_config"}

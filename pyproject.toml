[project]
name = "archie-nexus"
version = "0.1.0"
description = "Personal AI platform — workspace root"
requires-python = ">=3.13,<3.14"

[tool.uv.workspace]
members = ["cli", "agent"]

[dependency-groups]
dev = [
    "archie-agent",
    "archie-cli",
    "httpx>=0.27",
    "pytest>=9",
    "ruff>=0.15",
]

[tool.uv.sources]
archie-agent = { workspace = true }
archie-cli = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "N", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N818"]

[tool.pytest.ini_options]
testpaths = ["tests"]
